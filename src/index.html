<!DOCTYPE html>
<html>

<head>
    <title>Campus Club Members Registration</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        .container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .card {
            width: 480px;
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.10);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            margin: 0;
            font-size: 27px;
            color: #111827;
        }

        .header p {
            margin-top: 8px;
            color: #6b7280;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
            color: #374151;
        }

        input,
        select {
            width: 100%;
            height: 45px;
            padding: 0 13px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 14px;
            outline: none;
            background: white;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        button {
            width: 100%;
            height: 46px;
            margin-top: 8px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            font-weight: bold;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            font-size: 12px;
            color: #9ca3af;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="header">
            <h1>Campus Club Registration</h1>
            <p>Register as a member of your college club</p>
        </div>

        <form id="memberForm">

            <div class="form-group">
                <label>Member Name</label>
                <input type="text" id="name" placeholder="Enter your name">
            </div>

            <div class="form-group">
                <label>Register Number</label>
                <input type="text" id="regno" placeholder="Enter register number">
            </div>

            <div class="form-group">
                <label>Department</label>
                <select id="department">
                    <option value="">Select Department</option>
                    <option>IT</option>
                    <option>CSE</option>
                    <option>ECE</option>
                    <option>EEE</option>
                </select>
            </div>

            <div class="form-group">
                <label>Club Name</label>
                <input type="text" id="club" placeholder="Enter club name">
            </div>

            <div class="form-group">
                <label>Year</label>
                <select id="year">
                    <option value="">Select Year</option>
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                </select>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter email address">
            </div>

            <button type="submit">Register Member</button>

        </form>

        <div id="message"></div>

        <div class="footer">
            Campus Club Member Management System
        </div>

    </div>

</div>

<script>

document.getElementById("memberForm").onsubmit = async function(e) {

    e.preventDefault();

    let name = document.getElementById("name").value;
    let regno = document.getElementById("regno").value;
    let department = document.getElementById("department").value;
    let club = document.getElementById("club").value;
    let year = document.getElementById("year").value;
    let email = document.getElementById("email").value;

    if (name == "" || regno == "" || department == "" ||
        club == "" || year == "" || email == "") {

        document.getElementById("message").innerHTML =
            "Please fill all fields";

        return;
    }

    let data = {
        name: name,
        registerNumber: regno,
        department: department,
        clubName: club,
        year: Number(year),
        email: email
    };

    try {

        let base = window.location.pathname.replace(/\/$/, "");

        let response = await fetch(base + "/members", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        let result = await response.text();

        document.getElementById("message").innerHTML = result;

    } catch (error) {

        document.getElementById("message").innerHTML =
            "Registration Failed!";

    }
};

</script>

</body>
</html>
